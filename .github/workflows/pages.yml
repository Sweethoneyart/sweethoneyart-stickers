name: Publicar Aguapanela
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-commerce.cjs
      - uses: actions/configure-pages@v5
      - run: |
          mkdir _site
          cp *.html *.css *.js robots.txt _site/
          cp -r assets _site/
          if [ -f sitemap.xml ]; then cp sitemap.xml _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
